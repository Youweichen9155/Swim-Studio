<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swim Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#"><span class="brand-icon">≈</span><span>Swim Studio<small data-i18n="brandSub"></small></span></a><div class="header-right"><span class="local" data-i18n="local"></span><button id="help" data-i18n="help"></button><button id="language">English</button></div></header>
<main>
<div class="intro"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="subtitle" data-i18n="subtitle"></p></div><button id="demo" class="secondary" data-i18n="demo"></button></div>
<nav class="steps" aria-label="Workflow"><a href="#source"><b>01</b><span data-i18n="step1"></span></a><a href="#workbench"><b>02</b><span data-i18n="step2"></span></a><a href="#workbench"><b>03</b><span data-i18n="step3"></span></a><a href="#contact"><b>04</b><span data-i18n="step4"></span></a><a href="#results"><b>05</b><span data-i18n="step5"></span></a></nav>
<div id="message" role="status" aria-live="polite" hidden></div>
<section class="card animal-card"><label for="animalMode" data-i18n="animalMode"></label><select id="animalMode"><option value="tadpole" data-i18n="tadpoleMode"></option><option value="frog" data-i18n="frogMode"></option></select><p class="field-hint" data-i18n="animalHint"></p></section>
<section id="source" class="source card"><div><label class="file-button primary" for="videoFile" data-i18n="chooseVideo"></label><input id="videoFile" type="file" accept=".mp4,.mov,.avi,.mkv,.m4v" hidden><span class="muted" data-i18n="videoHint"></span></div><div class="saved"><label for="projects" data-i18n="saved"></label><select id="projects"><option value="">—</option></select><button id="openProject" data-i18n="open"></button></div></section>
<div id="workbench" class="workbench">
<section class="viewer card"><div class="section-head"><div><span class="eyebrow" data-i18n="workspace"></span><h2 id="recordingName" data-i18n="noVideo"></h2></div><span class="chip" id="videoMeta">—</span></div>
<div class="toolbar" role="toolbar"><button data-mode="arena" class="active" data-i18n="arenaTool"></button><button data-mode="head" data-i18n="headTool"></button><button data-mode="axis" id="axisTool" data-i18n="axisTool" hidden></button><button data-mode="crop" data-i18n="cropTool"></button><button id="undo" data-i18n="undo"></button><button id="clear" data-i18n="clear"></button><label class="zoom"> <span data-i18n="zoom"></span><select id="zoom"><option>1</option><option>2</option><option>4</option></select>×</label></div>
<p id="toolHint" class="hint"></p>
<div id="canvasScroller"><canvas id="canvas" width="960" height="540" aria-label="Video annotation canvas"></canvas><div id="emptyCanvas"><div class="empty-icon">＋</div><h3 data-i18n="emptyTitle"></h3><p data-i18n="emptyHint"></p></div></div>
<div class="scrub"><button id="firstFrame" data-i18n="firstFrame"></button><button id="previous" aria-label="Previous frame">−1</button><button id="next" aria-label="Next frame">+1</button><input id="frameSlider" aria-label="Video frame" type="range" min="0" max="0" value="0"><input id="frameNumber" aria-label="Frame number" type="number" min="0" value="0"><span id="timeLabel">0.000 s</span></div>
<div class="viewer-foot"><span id="annotationStatus">—</span><span data-i18n="singleAnimal"></span></div>
</section>
<aside class="settings card"><h2 data-i18n="settings"></h2><fieldset><legend data-i18n="arenaSettings"></legend>
<label><span data-i18n="arenaShape"></span><select id="arenaType"><option value="ellipse" data-i18n="dish"></option><option value="rectangle" data-i18n="tank"></option><option value="legacy_ellipse" data-i18n="legacy"></option></select></label>
<div id="dishFields"><label><span data-i18n="diameter"></span><input id="diameter" type="number" value="100" min="0.1" step="0.1"></label><label><span data-i18n="angle"></span><input id="angle" type="number" value="0" min="-360" max="360" step="0.1"></label></div>
<div id="tankFields" hidden><label><span data-i18n="width"></span><input id="tankWidth" type="number" value="200" min="0.1" step="0.1"></label><label><span data-i18n="height"></span><input id="tankHeight" type="number" value="85" min="0.1" step="0.1"></label></div>
<p class="field-hint" data-i18n="dimensionsHint"></p><div class="checkbox-row"><input id="calibrationReviewed" type="checkbox"><label for="calibrationReviewed" data-i18n="calibrationReviewed"></label></div></fieldset>
<fieldset id="frogFields" hidden><legend data-i18n="hindlimbTitle"></legend><div class="checkbox-row"><input id="hindlimbEnabled" type="checkbox" checked><label for="hindlimbEnabled" data-i18n="hindlimbEnabled"></label></div><p class="field-hint" data-i18n="hindlimbHint"></p><label><span data-i18n="foreground"></span><select id="polarity"><option value="dark" data-i18n="darkAnimal"></option><option value="light" data-i18n="lightAnimal"></option></select></label><label><span data-i18n="threshold"></span><input id="threshold" type="number" value="120" min="1" max="254"></label><label><span data-i18n="bodyLengths"></span><input id="bodyLengths" type="number" value="4" min="2" max="8" step="0.5"></label><p class="field-hint" data-i18n="maskHint"></p></fieldset>
<fieldset><legend data-i18n="videoSettings"></legend><label><span data-i18n="timebase"></span><input id="timebase" type="number" min="0.1" step="any" placeholder="Auto"></label><p class="field-hint" data-i18n="timebaseHint"></p><label><span data-i18n="frameStep"></span><input id="frameStep" type="number" value="1" min="1" max="120" step="1"></label><label><span data-i18n="modelSize"></span><select id="modelSize"><option value="384">384 × 384</option><option value="560" selected>560 × 560</option><option value="768">768 × 768</option></select></label><label><span data-i18n="device"></span><select id="device"><option value="cpu" data-i18n="cpu"></option><option value="auto" data-i18n="auto"></option><option value="mps">Apple GPU (MPS)</option><option value="cuda">NVIDIA GPU (CUDA)</option></select></label></fieldset>
<details><summary data-i18n="advanced"></summary><label><span data-i18n="minVisible"></span><input id="minVisible" type="number" min="1" value="2" step="1"></label><label><span data-i18n="spread"></span><input id="spread" type="number" min="0.1" value="38" step="0.1"></label><label><span data-i18n="dropPoints"></span><input id="dropPoints" type="text" placeholder="2, 5"></label><label><span data-i18n="smoothing"></span><input id="smoothing" type="number" min="0.01" value="0.5" step="0.1"></label><label><span data-i18n="gap"></span><input id="gap" type="number" min="0.01" value="0.5" step="0.1"></label><label><span data-i18n="maxSpeed"></span><input id="maxSpeed" type="number" min="0.1" value="200" step="1"></label><label><span data-i18n="boutGap"></span><input id="boutGap" type="number" min="0.01" value="2" step="0.1"></label><label><span data-i18n="notes"></span><textarea id="notes" rows="3"></textarea></label><p class="field-hint" data-i18n="notesHint"></p></details>
<div class="checkbox-row"><input id="makeQA" type="checkbox" checked><label for="makeQA" data-i18n="makeQA"></label></div><p class="field-hint" data-i18n="qaHint"></p>
</aside></div>
<section id="contact" class="card contact"><div class="section-head"><div><p class="eyebrow" data-i18n="step4"></p><h2 data-i18n="contactTitle"></h2></div><button id="addContact" data-i18n="addContact"></button></div><div class="contact-grid"><div><p class="field-hint" data-i18n="contactHint"></p><div class="contact-tools"><button id="markStart" data-i18n="markStart"></button><button id="markEnd" data-i18n="markEnd"></button><label><span data-i18n="start"></span><input id="contactStart" type="number" min="0" step="0.001" value="0"></label><label><span data-i18n="end"></span><input id="contactEnd" type="number" min="0" step="0.001" value="0"></label></div><div class="checkbox-row"><input id="reviewed" type="checkbox"><label for="reviewed" data-i18n="reviewed"></label></div></div><div><div id="contactList" class="contact-list"></div><div class="row"><label class="file-button" for="contactImport" data-i18n="importContacts"></label><input id="contactImport" type="file" accept=".tsv,.txt" hidden><button id="clearContacts" data-i18n="clearContacts"></button></div></div></div></section>
<section class="run-bar card"><div><button id="save" data-i18n="save"></button><button id="export" data-i18n="export"></button><label class="file-button" for="settingsImport" data-i18n="importSettings"></label><input id="settingsImport" type="file" accept=".json" hidden></div><div><button id="setup" data-i18n="setup"></button><button id="run" class="primary" data-i18n="run"></button></div></section>
<section id="results" class="card results"><div class="section-head"><div><p class="eyebrow" data-i18n="step5"></p><h2 data-i18n="resultTitle"></h2></div><button id="cancel" class="danger" data-i18n="cancel" hidden></button></div><p id="jobStatus" data-i18n="ready"></p><progress id="jobProgress" hidden></progress><div id="metrics" class="metrics"></div><div id="resultLinks" class="row"></div><div id="resultImages" class="result-images"></div><details><summary data-i18n="runLog"></summary><pre id="log"></pre></details></section>
<footer><span>Swim Studio 1.3.0 · CoTracker3</span><span data-i18n="footer"></span></footer>
</main>
<dialog id="guide"><div class="section-head"><h2 data-i18n="guideTitle"></h2><button id="closeHelp" data-i18n="close"></button></div><img id="guideImage" src="guide-zh.svg" alt="Calibration and workflow guide"><div class="guide-copy"><h3 data-i18n="guideCapture"></h3><p data-i18n="guideCaptureText"></p><h3 data-i18n="guideCalibration"></h3><p data-i18n="guideCalibrationText"></p><h3 data-i18n="guideReview"></h3><p data-i18n="guideReviewText"></p><h3 data-i18n="guideModel"></h3><p data-i18n="guideModelText"></p></div></dialog>
<script src="app.js"></script></body></html>
