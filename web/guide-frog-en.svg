<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#f6f9f7"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#17312f"><text x="35" y="42" font-size="24">Frog mode: trunk movement and hindlimb opening</text><text x="35" y="69" font-size="14">Fixed camera · One animal · Approximately planar swimming</text><rect x="25" y="90" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="560" y="90" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="25" y="335" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="560" y="335" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><text x="45" y="122" font-size="18">01  Calibrate the arena</text><text x="45" y="302" font-size="12">Dish: diameter. Tank: four corners and side lengths (mm).</text><text x="580" y="122" font-size="18">02  Select trunk points</text><text x="580" y="302" font-size="12">Pick 4–6 stable trunk features in frame 0; avoid limbs.</text><text x="45" y="367" font-size="18">03  Define the body axis</text><text x="45" y="547" font-size="12">A1 snout → A2 rear trunk centre; do not mark toes.</text><text x="580" y="367" font-size="18">04  Inspect the silhouette</text><text x="580" y="547" font-size="12">Check the orange mask; adjust threshold and rerun.</text><ellipse cx="165" cy="207" rx="91" ry="52" fill="#e9f3ef" stroke="#087f72" stroke-width="3"/><path d="M330 160 L463 158 L484 263 L314 266 Z" fill="#e9f3ef" stroke="#087f72" stroke-width="3"/><path d="M95 208 H237" stroke="#cb692c" stroke-width="2"/><text x="118" y="233" font-size="12">Real dimensions</text><text x="347" y="216" font-size="12">Real dimensions</text><g transform="translate(790,203)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#9cbbab" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><g fill="#cb692c" stroke="white"><circle cx="782" cy="192" r="5"/><circle cx="797" cy="192" r="5"/><circle cx="782" cy="203" r="5"/><circle cx="797" cy="203" r="5"/></g><text x="900" y="210" font-size="14">Trunk points</text><g transform="translate(190,448)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#9cbbab" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><path d="M190 400 V477" stroke="#9868c3" stroke-width="3"/><g fill="#9868c3"><circle cx="190" cy="400" r="5"/><circle cx="190" cy="477" r="5"/></g><text x="205" y="403" font-size="14">A1</text><text x="205" y="478" font-size="14">A2</text><text x="318" y="445" font-size="14">Body axis</text><g transform="translate(685,444)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#e69769" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><path d="M614 460 H756" stroke="#607782" stroke-dasharray="4 4"/><path d="M629 460 V522 M741 460 V522 M629 517 H741" fill="none" stroke="#087f72" stroke-width="1.5"/><text x="794" y="413" font-size="12">Posterior cutoff</text><text x="794" y="445" font-size="12">Width = posterior pixel x95 − x05</text><text x="794" y="480" font-size="10">Not foot separation, joint angle or muscle strength</text><text x="35" y="598" font-size="14">Contact and invalid tracking are excluded; missing frames are not zero.</text></g></svg>
