<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="1100" height="620" fill="#f6f9f7"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#17312f"><text x="35" y="42" font-size="24">小蛙模式：躯干位移与后肢展开</text><text x="35" y="69" font-size="14">固定相机 · 单只动物 · 近似平面游泳</text><rect x="25" y="90" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="560" y="90" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="25" y="335" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><rect x="560" y="335" width="515" height="225" rx="14" fill="white" stroke="#dbe6e2"/><text x="45" y="122" font-size="18">01  校准容器</text><text x="45" y="302" font-size="12">圆皿输入直径；方缸选四角并填写边长（mm）</text><text x="580" y="122" font-size="18">02  躯干选点</text><text x="580" y="302" font-size="12">首帧选择 4–6 个躯干稳定点，避开四肢</text><text x="45" y="367" font-size="18">03  身体方向轴</text><text x="45" y="547" font-size="12">A1 吻端 → A2 躯干后端中点，不选脚趾</text><text x="580" y="367" font-size="18">04  后肢轮廓</text><text x="580" y="547" font-size="12">检查橙色区域；调整前景阈值后可重新分析</text><ellipse cx="165" cy="207" rx="91" ry="52" fill="#e9f3ef" stroke="#087f72" stroke-width="3"/><path d="M330 160 L463 158 L484 263 L314 266 Z" fill="#e9f3ef" stroke="#087f72" stroke-width="3"/><path d="M95 208 H237" stroke="#cb692c" stroke-width="2"/><text x="118" y="233" font-size="12">实际尺寸</text><text x="347" y="216" font-size="12">实际尺寸</text><g transform="translate(790,203)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#9cbbab" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><g fill="#cb692c" stroke="white"><circle cx="782" cy="192" r="5"/><circle cx="797" cy="192" r="5"/><circle cx="782" cy="203" r="5"/><circle cx="797" cy="203" r="5"/></g><text x="900" y="210" font-size="14">躯干点</text><g transform="translate(190,448)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#9cbbab" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><path d="M190 400 V477" stroke="#9868c3" stroke-width="3"/><g fill="#9868c3"><circle cx="190" cy="400" r="5"/><circle cx="190" cy="477" r="5"/></g><text x="205" y="403" font-size="14">A1</text><text x="205" y="478" font-size="14">A2</text><text x="318" y="445" font-size="14">身体轴</text><g transform="translate(685,444)"><path d="M-17 13 L-50 42 L-65 74 L-37 50 L-12 25 M17 13 L50 42 L65 74 L37 50 L12 25" fill="#e69769" stroke="#719180" stroke-width="2"/><path d="M-17 -22 L-45 -5 L-47 -23 M17 -22 L45 -5 L47 -23" fill="none" stroke="#9cbbab" stroke-width="7"/><ellipse cy="-7" rx="24" ry="41" fill="#9cbbab"/><circle cx="-12" cy="-34" r="4"/><circle cx="12" cy="-34" r="4"/></g><path d="M614 460 H756" stroke="#607782" stroke-dasharray="4 4"/><path d="M629 460 V522 M741 460 V522 M629 517 H741" fill="none" stroke="#087f72" stroke-width="1.5"/><text x="794" y="413" font-size="12">后侧截线</text><text x="794" y="445" font-size="12">宽度 = 后侧像素 x95 − x05</text><text x="794" y="480" font-size="10">不是双足间距、关节角度或肌肉力量</text><text x="35" y="598" font-size="14">直接接触和无效追踪被排除；缺失帧不当作零。</text></g></svg>
